<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>twitter</title>
    <link rel="stylesheet" href="/frontend/style.css">
    <link href='https://unpkg.com/boxicons@latest/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="../frontend/image/logo-synthetica.png" alt="logo" class="logo-synthetica">
            </div>
            <nav>
                <ul>
                  <li><a href="#home">home</a></li>
                  <li><a href="#articles">articles</a></li>
                  <li><a href="#about">about</a></li>
                  <li><a href="#IA's">IA's</a></li>
                </ul>
            </nav>
            <div class="login">
                <button>get started</button>
            </div>
        </header>

        <section class="hero">
            <div class="textohero">
                <div class="titulo">
                
                    <div class="imghero">
                        <img src="../frontend/image/logo-synthetica.png" alt="logo">
                    </div>
                    <div class="linha"></div>
                    <div class="phero">
                        <p>Hello! let's explore the digital journey where emotion and technology connect.</p>
                        <p> Discover a new way to interact with the (current) future.</p>
                    </div>
                </div>
                <div class="subtitulo">
                    <p>Where artificial intelligence meets the human soul.</p>
                </div>

            </div>


            <div class="botoes">
                <button class="botao1"><i class='bx bxs-palette'></i> art and culture.</button>
                <button class="botao2"><i class='bx bx-news'></i> latest news.</button>
            </div>
        </section>

        
    </div>
        <section class="formulario">
            <div class="input">

                <form id="item-form">   

                    <div class="texto">
                        <img src="/frontend/image/WhatsApp Image 2025-03-27 at 08.35.21.jpeg" alt="Avatar" class="avatar">
                        <textarea id="item" placeholder="What's happening?" required></textarea>
                    </div>

                    <div class="botao">
                        <button type="submit">Post</button>
                    </div>
                </form>
            </div>
        </section>


    
        <section class="posts-exibir">
            <div class="posts">
                <ul id="item-list"></ul>
            </div> 
        </section>
    <footer>

    </footer>

    <script src="/frontend/script.js"></script>
</body>
</html>
